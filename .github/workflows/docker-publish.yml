name: Docker Build and Push

# =============================================================================
# 触发条件: workflow_dispatch 手动触发（Actions 页或 gh workflow run）
# 构建产物: linux/amd64 + linux/arm64 多架构镜像
# 推送目标: 阿里云容器镜像服务 (ACR)
# 镜像标签: 默认分支 :latest; commit 短 sha; 分支名
# =============================================================================

on:
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
  NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
  IMAGE_NAME: images-repo-sync

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------
      # 1. 检出代码
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2. 设置 QEMU (用于 arm64 仿真)
      # -------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # -------------------------------------------------------------------
      # 3. 设置 Docker Buildx (多架构构建)
      # -------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # -------------------------------------------------------------------
      # 4. 登录阿里云 ACR
      # -------------------------------------------------------------------
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # -------------------------------------------------------------------
      # 5. 生成镜像 tag 和 label 元数据
      #     默认分支打 :latest; 每次提交打 commit 短 sha (与 Makefile / Gitea 对应)
      # -------------------------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # 默认分支 (main) 打 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # commit 短 sha (如 4f5fb2a),与 Makefile 一致
            type=sha,format=short,prefix=
            # 分支名 (如 main)
            type=ref,event=branch
            # git tag 名 (如 v1.2.3)
            type=ref,event=tag
            # 语义化版本 (仅推送 semver tag 时生效)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # -------------------------------------------------------------------
      # 6. 多架构构建并推送
      #    GitHub Actions runner 在海外,使用默认国际镜像源而非 CN 代理
      # -------------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # ACR 不接受 attestation 里的 application/vnd.oci.empty.v1+json
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
