name: Docker Build and Push

# =============================================================================
# 触发条件: 推送 v* 格式的 tag (如 v1.0.0、v2.3.1)
# 构建产物: linux/amd64 + linux/arm64 多架构镜像
# 推送目标: 阿里云容器镜像服务 (ACR)
# =============================================================================

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
  NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
  IMAGE_NAME: images-repo-sync

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------
      # 1. 检出代码
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2. 设置 QEMU (用于 arm64 仿真)
      # -------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # -------------------------------------------------------------------
      # 3. 设置 Docker Buildx (多架构构建)
      # -------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # -------------------------------------------------------------------
      # 4. 登录阿里云 ACR
      # -------------------------------------------------------------------
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # -------------------------------------------------------------------
      # 5. 生成镜像 tag 和 label 元数据
      #     latest=auto: 只有稳定版 tag (不含 -beta/-rc) 才打 :latest
      # -------------------------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            # 完整的 tag 名 (如 v1.2.3)
            type=ref,event=tag
            # 语义化版本 (如 1.2.3)
            type=semver,pattern={{version}}
            # 主版本.次版本 (如 1.2)
            type=semver,pattern={{major}}.{{minor}}
            # 主版本 (如 1)
            type=semver,pattern={{major}}

      # -------------------------------------------------------------------
      # 6. 多架构构建并推送
      #    GitHub Actions runner 在海外,使用默认国际镜像源而非 CN 代理
      # -------------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
